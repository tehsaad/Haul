name: Linux build and tests

on:
  push:
    branches: [ "feature/**", "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-svg-dev libgl-dev libcurl4-openssl-dev libsqlite3-dev \
            ninja-build pkg-config python3 ffmpeg

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Test
        run: ctest --preset linux-debug

      - name: Browser extension in real Chrome
        run: node tests/browser/e2e.mjs build/linux-debug/src/haul-native-host

      - name: Build Debian package
        run: |
          sudo apt-get install -y --no-install-recommends dpkg-dev
          cmake --preset linux-release
          cmake --build --preset linux-release
          cd build/linux-release && cpack -G DEB
          dpkg-deb -f haul_*.deb Package Version Depends
          dpkg-deb -c haul_*.deb

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: haul-deb-ubuntu-24.04
          path: build/linux-release/haul_*.deb
